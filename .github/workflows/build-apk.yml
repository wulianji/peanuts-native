# Peanuts Native —— 编译"共存版"APK（含 86 款 Switch 1 支持中文游戏的 profile）
#
# 用法：
#   1) Fork https://github.com/igawa6/peanuts-native 到你自己的 GitHub 账号
#   2) 在 fork 仓库点 Actions → New workflow → 把本文件内容贴进去，
#      保存为 .github/workflows/build-apk.yml，提交到 main
#   3) 回到 Actions 页，点左侧 "Build Peanuts co-exist APK" → Run workflow → 绿色按钮
#   4) 跑完后进入该次运行，页面底部 Artifacts 下载 peanuts-coexist-apk
#
# 本版已注入简体中文语言包（启动器界面汉化）。
# 产物：独立包名 dev.nxnative.android.peanutstest，可与官方版共存、存档互不干扰。
# 注意：APK 只是启动器 + 游戏 profile，不含游戏本体。装好后仍需在手机上用
#       你自己的 ROM 走 Prepare 生成 game pack（本 APK 带完整 on-device packer）。
#
# 更新说明：去掉了 android-actions/setup-android（拉仓库常超时），改用 runner 自带 SDK + 重试。

name: Build Peanuts co-exist APK

on:
  workflow_dispatch:  # 只手动触发，不自动跑

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ---------- 1. 源码 ----------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # build.gradle 读 git commit/branch 生成 build tag，需要完整历史

      # ---------- 1b. 注入简体中文语言包 ----------
      # 内嵌补丁：汉化 Java 硬编码 UI 字符串 + 中文 strings.xml
      - name: Inject Chinese (zh-CN) language pack
        run: |
          mkdir -p .zhpatch android/app/src/main/res/values-zh-rCN
          echo "$ZH_B64" | base64 -d > .zhpatch/zh_patch.py
          echo "$SX_B64" | base64 -d > android/app/src/main/res/values-zh-rCN/strings.xml
          python3 .zhpatch/zh_patch.py
        env:
          ZH_B64: 
          SX_B64: 

      # ---------- 2. zsh（上游 packer 脚本是 zsh 写的）----------
      - name: Install zsh / build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh ninja-build cmake libdigest-sha-perl
          shasum -a 256 /etc/hostname >/dev/null && echo "shasum OK"

      # ---------- 3. JDK 21（Gradle 8.14.3 需要 17/21，不能用 27）----------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ---------- 4. .NET 10 SDK（编译 shader 翻译器 NativeAOT 库）----------
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ---------- 5. Android SDK（用 runner 预装的，不装那个常超时的 action）----------
      - name: Install Android platform / build-tools / NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)
          [ -n "$SDKMGR" ] || { echo "[RED] sdkmanager not found under $ANDROID_HOME"; exit 1; }
          echo "SDKMGR=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          # Google 仓库偶尔超时，重试 3 次
          for i in 1 2 3; do
            echo "=== sdkmanager install attempt $i ==="
            "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" && break
            echo "attempt $i failed, retry in 15s"
            sleep 15
          done
          [ -d "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt" ] || { echo "[RED] NDK 28.2 missing"; exit 1; }
          [ -d "$ANDROID_HOME/platforms/android-36" ] || { echo "[RED] platform 36 missing"; exit 1; }
          echo "SDK components OK"

      - name: Export Android env
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > android/app/local.properties
          echo "NDK: $ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" > /dev/null && echo "NDK OK"

      # ---------- 6. 生成 on-device packer stage（约 10-20 分钟）----------
      # 产出手机上那套完整的 Prepare 引擎：CPython 3.14 + Capstone + lz4 +
      # shader 翻译器 + SPIRV-Tools。有了它，APK 装到手机上就能直接从 ROM 做 pack。
      - name: Build on-device packer stage
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          zsh peanuts/scripts/ondevice-stage.sh "$RUNNER_TEMP/pnwork"
          echo "PN_STAGE=$RUNNER_TEMP/pnwork/stage" >> "$GITHUB_ENV"
          du -sh "$RUNNER_TEMP/pnwork/stage"

      # ---------- 7. 编译 APK ----------
      # -PnxApp=peanuts + -PnxAppId=peanutstest → 包名 dev.nxnative.android.peanutstest（共存）
      # -PnxGames=<id>,<id> → 把这些游戏的 profile 编进去（86 款 Switch 1 支持中文的游戏，已剔除 Switch 2 标题）
      # -PnxPackStage=... → 带上真实 packer（不加 -PnxPackEngine=fake）
      - name: Build APK
        working-directory: android/app
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          chmod +x ./gradlew
          ./gradlew apk --no-daemon \
            -PnxApp=peanuts \
            -PnxAppId=peanutstest \
            -PnxLabel="Peanuts test" \
            -PnxGames=010089B00D09C000,0100713016CCC000,0100C2A01A730000,0100CC80140F8000,0100698009C6E000,010040801A4C8000,01006A800016E000,01007BB017812000,0100ABD01785C000,010057D006492000,0100A3501946E000,0100BF00112C0000,010020D01AD24000,0100D7C01F254000,0100A9D01C446000,01006C300E9F0000,01008D7016438000,01002E7016C46000,0100535012974000,0100A00019DE0000,010092B0091D0000,010054B01AD92000,0100AE00096EA000,010036E00FB20000,01009D901BC56000,0100C1F0051B6000,0100346017304000,010032E00E6E2000,010062B01525C000,0100CD801CE5E000,010056B015FE8000,01002CD00A51C000,0100E44016C22000,010029B018432000,0100E95004038000,010074F013262000,0100FF500E34A000,0100EC9010258000,010051701FB46000,0100B04011742000,010014E00DB56000,01008C0016544000,0100E65002BB8000,0100B8A026F14000,0100BC300CB48000,0100CE4010AAC000,010038B015560000,010029B0118E8000,0100646009FBE000,0100217023F6C000,0100429011144000,010014C011146000,010076F0049A2000,01007960049A0000,01004A4010FEA000,010086A022444000,0100B7C00933A000,010069C01AB82000,0100633007D48000,010013C00E930000,0100ECD018EBE000,0100A3900C3E2000,0100620012D6E000,0100D9F01D474000,0100A5C00D162000,0100199023B2E000,010089C01E9CA000,010016100A186000,01009320084A4000,0100CA9002322000,01002B30028F6000,0100ACD0163D0000,010063301BD50000,010031F019294000,0100965017338000,010099C022B96000,0100FD8022DAA000,010005501E68C000,0100D5B026844000,010012101468C000,0100A83022A22000,0100B99019412000,0100317013770000,010067300059A000,01006FE013472000,01004AB00A260000 \
            -PnxPackStage="$RUNNER_TEMP/pnwork/stage"
          echo "--- out/ ---"
          ls -lh out/

      # ---------- 8. 上传产物 ----------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: peanuts-coexist-apk
          path: android/app/out/*.apk
          if-no-files-found: error
          retention-days: 30
