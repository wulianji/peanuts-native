# Peanuts Native —— 编译"共存版"APK（含 010054B01AD92000 圣兽之王 亚洲版 profile）
#
# 用法：
#   1) Fork https://github.com/igawa6/peanuts-native 到你自己的 GitHub 账号
#   2) 在本仓库点 Actions → New workflow → 把本文件内容贴进去，
#      保存为 .github/workflows/build-apk.yml，提交到 main
#   3) 回到 Actions 页，点左侧 "Build Peanuts co-exist APK" → Run workflow
#   4) 跑完后进入该次运行，页面底部 Artifacts 下载 peanuts-coexist-apk
#
# 产物：独立包名 dev.nxnative.android.peanutstest，可与官方版共存、存档互不干扰。
# 注意：APK 只是启动器 + 游戏 profile，不含游戏本体。装好后仍需在手机上用
#       你自己的 ROM 走 Prepare 生成 game pack（本 APK 带完整 on-device packer）。

name: Build Peanuts co-exist APK

on:
  workflow_dispatch:  # 只手动触发，不自动跑

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # ---------- 1. 源码 ----------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # build.gradle 读 git commit/branch 生成 build tag，需要完整历史

      # ---------- 2. zsh（上游 packer 脚本是 zsh 写的）----------
      - name: Install zsh / build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh ninja-build cmake libdigest-sha-perl
          # upstream build.sh 用 shasum -a 256 校验下载；libdigest-sha-perl 提供它
          shasum -a 256 /etc/hostname >/dev/null && echo "shasum OK"

      # ---------- 3. JDK 21（Gradle 8.14.3 需要 17/21，不能用 27）----------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ---------- 4. .NET 10 SDK（编译 shader 翻译器 NativeAOT 库）----------
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ---------- 5. Android SDK platform 36 + build-tools + NDK 28.2 ----------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform / build-tools / NDK
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Export Android env
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > android/app/local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt" > /dev/null && echo "NDK OK"

      # ---------- 6. 生成 on-device packer stage（约 10-20 分钟）----------
      # 这一步产出手机上那套完整的 Prepare 引擎：CPython 3.14 + Capstone + lz4 +
      # shader 翻译器 + SPIRV-Tools。有了它，APK 装到手机上就能直接从 ROM 做 pack。
      - name: Build on-device packer stage
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          zsh peanuts/scripts/ondevice-stage.sh "$RUNNER_TEMP/pnwork"
          echo "PN_STAGE=$RUNNER_TEMP/pnwork/stage" >> "$GITHUB_ENV"
          du -sh "$RUNNER_TEMP/pnwork/stage"

      # ---------- 7. 编译 APK ----------
      # -PnxApp=peanuts + -PnxAppId=peanutstest → 包名 dev.nxnative.android.peanutstest（共存）
      # -PnxGames=<title ID> → 只把这游戏的 profile 编进去（这里换成你要的游戏 ID）
      # -PnxPackStage=... → 带上真实 packer（不加 -PnxPackEngine=fake）
      - name: Build APK
        working-directory: android/app
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          chmod +x ./gradlew
          ./gradlew apk --no-daemon \
            -PnxApp=peanuts \
            -PnxAppId=peanutstest \
            -PnxLabel="Peanuts test" \
            -PnxGames=010054B01AD92000 \
            -PnxPackStage="$RUNNER_TEMP/pnwork/stage"
          echo "--- out/ ---"
          ls -lh out/

      # ---------- 8. 上传产物 ----------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: peanuts-coexist-apk
          path: android/app/out/*.apk
          if-no-files-found: error
          retention-days: 30
